# Buildkite pipeline for Flox on hosted agents.
#
# Prereq: the queue uses the custom agent image from .buildkite/agent-image/,
# so `flox` is already installed (no install step here).
#
# NOTE on caching /nix:
# Flox (and its bundled Nix) lives entirely under /nix/store -- /usr/bin/flox is
# just a symlink into /nix. A naive cache volume mounted at /nix SHADOWS the /nix
# baked into the agent image (the volume is empty on the first build), which turns
# /usr/bin/flox into a dangling symlink -> "flox: command not found".
#
# So we do NOT cache-mount /nix here. Flox is baked into the image and always
# present; `flox activate` downloads just this env's packages each build. Warm
# cross-build caching needs the "seed" pattern (see README) and is deliberately
# left out until the basic path is green.

steps:
  - label: ":mag: validate agent + flox"
    command: |
      echo "--- runtime user / environment"
      whoami
      id
      echo "NIX_REMOTE=$NIX_REMOTE"
      echo "--- flox is preinstalled in the agent image"
      command -v flox
      flox --version
      echo "--- /nix is writable by the job user?"
      test -w /nix && echo "yes: /nix writable" || echo "NO: /nix not writable"

  - wait

  - label: ":flox: activate environment"
    command: |
      echo "--- activate the repo environment and run real package binaries"
      time flox activate -- bash -c 'hello && jq --version'
