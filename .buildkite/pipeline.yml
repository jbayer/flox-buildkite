# Buildkite pipeline for Flox on hosted agents, with a warm /nix cache.
#
# Prereq: the queue uses the custom agent image from .buildkite/agent-image/,
# which (a) has Flox preinstalled and (b) stashes the baked Nix store at
# /opt/nix-seed so the cache volume can be seeded when cold.
#
# Caching model (see README "Caching /nix" for the full explanation):
#   - The cache volume below persists /nix across builds.
#   - Flox lives under /nix/store, so an empty volume would shadow the baked-in
#     Flox. `.buildkite/lib/ensure-nix.sh` seeds the volume from /opt/nix-seed
#     when it is cold, restoring a usable Flox; on a warm volume it is a no-op.
#   - Env packages that `flox activate` pulls then persist in the volume, so
#     later builds activate without re-downloading them.
cache:
  name: "flox-nix-store"
  # Size is a cap, not a reservation -- set it comfortably above your warm /nix
  # size (seed + the full env closure) so a large env never hits the ceiling.
  size: "50g"
  paths:
    - "/nix"

steps:
  - label: ":mag: validate agent + flox"
    command: |
      echo "--- runtime user / environment"
      whoami
      id
      echo "NIX_REMOTE=$NIX_REMOTE"
      echo "--- ensure /nix cache volume is usable (seed if cold)"
      bash .buildkite/lib/ensure-nix.sh
      echo "--- /nix store size"
      du -sh /nix 2>/dev/null
      echo "--- flox on PATH?"
      command -v flox
      echo "--- /nix writable?"
      test -w /nix && echo "yes: /nix writable" || echo "NO: /nix not writable"

  - wait

  - label: ":flox: activate environment"
    command: |
      bash .buildkite/lib/ensure-nix.sh
      echo "--- /nix store size before activate"
      du -sh /nix 2>/dev/null
      echo "--- activate the repo environment and run the sentinel package binary"
      echo "    (cold build: downloads the env closure into the volume; warm build: instant)"
      echo "    'hello' is the smoke-test sentinel pinned in .flox/env/manifest.toml"
      time flox activate -- hello
      echo "--- /nix store size after activate (grows cold->warm as packages land)"
      du -sh /nix 2>/dev/null
