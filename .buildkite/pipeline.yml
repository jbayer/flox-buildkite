# The simple, universal Flox pipeline. Works the same on:
#   - Tier 0: install Flox per build (any Linux queue, no custom image), and
#   - Tier 1: a custom agent image has Flox baked in, so the install no-ops.
# Nothing in this file changes between tiers. See the README quick start.
#
# Runs on any Linux hosted or self-hosted queue. Optional add-ons (this file's
# shape stays the same):
#   - /nix cache volume (advanced) -> .buildkite/examples/pipeline.cached.yml
#                                     + docs/hosted-linux.md
#   - S3 binary cache              -> docs/s3-cache.md (README building blocks 3 & 4)
env:
  NIX_REMOTE: "auto"        # single-user Nix (operate on /nix/store directly; no daemon)
  FLOX_SHELL: "bash"        # CI has no tty -- silences flox's shell-detect warning
  # FLOX_VERSION: "1.12.1"  # optional: pin a version (default: latest stable)
steps:
  - label: ":flox: install and activate"
    command: |
      set -euo pipefail
      bash .buildkite/lib/linux-install-flox.sh   # installs Flox if not already present
      flox activate -- hello                      # <- replace `hello` with your build command (e.g. make test)
